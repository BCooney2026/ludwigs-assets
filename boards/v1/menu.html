  }
  /**
   * Live price into a slide, then make it fit: long titles step down
   * until they take two lines, and the photo shrinks if the Today card
   * is tall, so the food never runs into the words.
   */
  function dressSlide(p, el) {
    if (p.live) dressLive(p, el);
    el.style.setProperty("--dur", secondsOf(p) + "s");
    el.querySelectorAll(".price").forEach(n => { n.innerHTML = RS.money(promoPrice(p)); });
    const t = el.querySelector(".title");
    if (t) {
      let size = 66; t.style.fontSize = size + "px";
      const lines = () => Math.round(t.offsetHeight / (size * 0.95));   // layout px, not scaled px
      while ((t.scrollWidth > t.clientWidth + 1 || lines() > 2) && size > 44) { size -= 2; t.style.fontSize = size + "px"; }
    }
    const plate = el.querySelector(".plate");
    if (plate && photoShape[p.img]) {
      const a = p.art || {};
      const room = el.querySelector(".art").clientHeight - 52 - Math.abs(a.y || 0);
      const tilt = Math.abs(a.rot || 0) * Math.PI / 180;
      // Height the photo takes at width 1 (a tilted photo stands taller).
      const tall = Math.cos(tilt) / photoShape[p.img] + Math.sin(tilt);
      const full = Math.min(a.w || 430, 440), w = Math.round(Math.min(full, room / tall));
      plate.style.width = w + "px";
      plate.style.marginLeft = Math.round((a.x || 0) * w / full) + "px";
    }
  }

  /** Words for a live scene, fresh from the feed. Soups shrink to fit (up to 8). */
  function dressLive(p, el) {
    if (p.live === "soups") {
      const list = liveSoups();
      const ul = el.querySelector(".soupcard ul");
      ul.innerHTML = list.map((s, i) => '<li style="animation-delay:' + (0.5 + i * 0.12).toFixed(2) + 's"><span class="nm">' + esc(s.name) + '</span>' +
        (Array.isArray(s.tags) && s.tags.length ? '<span class="tg">' + s.tags.map(esc).join(" · ") + '</span>' : '') + '</li>').join("");
      const bg = el.querySelector(".soupbg"), withPhoto = list.find(x => soupSrc(x));
      if (bg) {
        if (withPhoto) { const f = soupSrc(withPhoto); if (bg.getAttribute("src") !== f) bg.src = f; bg.style.display = ""; }
        else bg.style.display = "none";
      }
      // No soup photo at all: the bigger centered "solo" look (CSS above).
      const solo = !withPhoto && list.length <= 3;
      el.querySelector(".soupcard").classList.toggle("solo", solo);
      const room = el.querySelector(".art").clientHeight - 24;
      let sz = solo ? [76, 66, 56][list.length - 1] || 56 : list.length <= 4 ? 46 : list.length <= 6 ? 40 : 34;
      ul.style.setProperty("--sz", sz + "px");
      while (ul.offsetHeight > room && sz > 24) { sz -= 2; ul.style.setProperty("--sz", sz + "px"); }
      return;
    }
    const t = el.querySelector(".title"), d = el.querySelector(".desc");
    const eb = el.querySelector(".eyebrow span");
    if (p.live === "special") {
      const sp = liveSpecial(p) || { kind: "", name: "", desc: "" };
      // Photo: full window with the price in the bar below. No photo (or not
      // here yet): the gold circle. A photo that arrives later is swapped in.
      const pic = specialSrc(sp, () => dressLive(p, el));
      const clip = el.querySelector(".spphoto"), medal = el.querySelector(".medal"), bar = el.querySelector(".pricebar");
      if (pic && clip.querySelector("img").getAttribute("src") !== pic) clip.querySelector("img").src = pic;
      clip.style.display = pic ? "" : "none";
      medal.style.display = pic ? "none" : "";
      if (bar) bar.style.display = pic ? "" : "none";
      el.classList.toggle("has-clip", !!pic);
      if (eb) eb.textContent = sp.kind || "Today's Special";
      if (t) t.textContent = sp.name;
      if (d) { d.textContent = sp.desc || ""; d.style.display = sp.desc ? "" : "none"; }
    } else if (p.live === "soupspot") {
      const list = liveSoupSpots();
      const s = list.length ? list[(p.turn || 0) % list.length] : null;
      const img = el.querySelector(".clip.photo > img"), src = s ? soupSrc(s) : "";
      if (src && img && img.getAttribute("src") !== src) img.src = src;
      if (t) t.textContent = s ? s.name : "";
      const tags = s && Array.isArray(s.tags) ? s.tags : [];
      if (d) { d.textContent = tags.join(" \u00b7 "); d.style.display = tags.length ? "" : "none"; }
    } else if (p.live === "catering") {
      const c = liveCatering() || { headline: "", message: "" };
      if (t) t.textContent = c.headline;
      if (d) { d.textContent = c.message || ""; d.style.display = c.message ? "" : "none"; }
    } else if (p.live === "cookie") {
      if (t) t.textContent = liveCookie();
    } else if (p.live === "cookiespot") {
      const src = cookieSrc();
      const img = el.querySelector(".clip.photo > img");
      if (src && img && img.getAttribute("src") !== src) img.src = src;
      if (t) t.textContent = liveCookie();
    }
  }

  /*
   * VIDEO. One clip at a time, only while its promo is on screen.
   * The still stays visible until the clip is truly playing ("playing"
   * plus a first frame), and comes back if the clip errors, never
   * starts within 8 seconds, or stalls for 3 seconds. A clip that failed
   * is left alone for 3 minutes, then tried again. A start the browser
   * refuses is retried, and never benches the clip.
   */
  const videoBad = {};          // file -> time it last failed
  let liveVideo = null;
  function stopVideo() {
    if (!liveVideo) return;
    const v = liveVideo; liveVideo = null;
    clearTimeout(v._watch);
    v.classList.remove("live");
    setTimeout(() => { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} v.remove(); }, 800);
  }
  function startVideo(p, el) {
    stopVideo();
    if (!p.video || STILL || VIDEO_OFF) return;
    if (videoBad[p.video] && Date.now() - videoBad[p.video] < 3 * 60 * 1000) return;
    const box = el.querySelector(".clip");
    if (!box) return;
    const v = document.createElement("video");
    v.muted = true; v.defaultMuted = true; v.loop = p.loop !== false; v.playsInline = true; v.autoplay = true;
    v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("preload", "auto");
    v.disablePictureInPicture = true;
    const fail = why => {
      if (liveVideo !== v) return;
      // A refused start ("blocked") is not the file's fault: try again next
      // time round. Only a real error or stall benches the clip, briefly.
      if (why !== "blocked") videoBad[p.video] = Date.now();
      videoNote = p.video + " " + why;
      stopVideo(); diag();
    };
    const watch = (ms, why) => { clearTimeout(v._watch); v._watch = setTimeout(() => fail(why), ms); };
    v.addEventListener("playing", () => { clearTimeout(v._watch); });
    // Show the clip only after a frame has really been drawn.
    v.addEventListener("timeupdate", () => { if (v.currentTime > 0.05 && liveVideo === v) { v.classList.add("live"); videoNote = p.video + " playing"; } });
    v.addEventListener("waiting", () => watch(3000, "stalled"));
    v.addEventListener("stalled", () => { if (!v.classList.contains("live")) watch(8000, "no data"); });
    v.addEventListener("error", () => fail("error"));
    // Played once (loop: false): fade back to the still. Not a failure.
    v.addEventListener("ended", () => { if (liveVideo === v) { videoNote = p.video + " ended"; stopVideo(); diag(); } });
    liveVideo = v;
    watch(8000, "did not start");
    v.src = VIDEO_DIR + p.video;
    box.appendChild(v);
    // If the start is refused, try once more a moment later before giving up.
    const tryPlay = again => {
      const pr = v.play();
      if (pr && pr.catch) pr.catch(() => { if (liveVideo !== v) return; if (again) setTimeout(() => tryPlay(false), 700); else fail("blocked"); });
    };
    tryPlay(true);
  }
  let videoNote = "";

  let current = null, heroTimer = null, heroList = [], bootAt = 0;
  // A full-screen reel hands off to its matching window clip: that promo
  // is held on screen for its own length, then the clock rotation resumes.
  let heroForce = null;                       // { id, until }
  function forceHero(id) {
    const f = PROMOS.find(x => x.id === id);
    if (!f || eligible().indexOf(f) < 0) return;
    heroForce = { id: id, until: Date.now() + secondsOf(f) * 1000 };
    if (current) { current.classList.remove("on", "snap", "settled", "out"); current = null; }   // hidden under the reel
    showPromo(false);
  }
  function showPromo(first) {
    clearTimeout(heroTimer);
    heroList = eligible();
    let pick = clockPick(heroList);
    let p = heroList[pick.index];
    if (heroForce && Date.now() < heroForce.until) {
      const i = heroList.findIndex(x => x.id === heroForce.id);
      if (i >= 0) { p = heroList[i]; pick = { index: i, left: (heroForce.until - Date.now()) / 1000 }; }
    } else heroForce = null;
    const el = slideFor(p);

    if (current !== el) {
      // Right after power-on the new promo snaps in, so the old one (the
      // wordmark card) leaves at once instead of fading over it.
      const snapIn = first === true || Date.now() - bootAt < 4000;
      if (current) {
        const old = current;
        old.classList.remove("on", "snap", "settled");
        if (!snapIn) { old.classList.add("out"); setTimeout(() => old.classList.remove("out"), 1200); }
      }
      el.classList.remove("out", "snap", "settled");
      // A promo with photos: [...] shows the next one each time round the rotation.
      if (p.photos) {
        const ok = p.photos.filter(f => photoOk[f] === true);
        const img = el.querySelector(".clip.photo > img");
        if (ok.length && img) {
          const total = heroList.reduce((n, x) => n + secondsOf(x), 0) || 1;
          img.src = IMG + ok[Math.floor(Date.now() / 1000 / total) % ok.length];
        }
      }
      if (p.live === "soupspot") p.turn = (p.turn || 0) + 1;   // next soup each time round
      dressSlide(p, el);
      void el.offsetWidth;                       // restart the sequence
      // First frame after power-on (and the first food photo to land
      // after it) appears finished, with no entrance.
      if (snapIn) el.classList.add("snap");
      el.classList.add("on");
      current = el;
      setTimeout(() => { if (current === el) el.classList.add("settled"); }, 1600);
      startVideo(p, el);
    } else {
      dressSlide(p, el);
    }
    document.getElementById("ticks").innerHTML = heroList.length > 1
      ? heroList.map((x, i) => '<i class="' + (i === pick.index ? 'on' : '') + '"></i>').join("") : "";
    diag();
    heroTimer = setTimeout(showPromo, Math.max(500, pick.left * 1000 + 30));
  }
  /** Fresh prices arrived: update what is on screen without restarting it. */
  function refreshHero() {
    PROMOS.concat(BRAND_CARD).forEach(p => { if (slides[p.id]) dressSlide(p, slides[p.id]); });
    // If the promo on screen just became invalid (item removed), move on now.
    const now = heroList.length ? heroList[clockPick(heroList).index] : null;
    if (!current || !now || eligible().indexOf(now) < 0) showPromo(false);
  }

  /* ---------- Today card (always on screen) ---------- */
  /** Bake strip across the bottom of the menu, TV 1 only (pizzas). Ludwig's
      own instructions from their menu. */
  function bakeStrip() {
    return tv === 1
      ? '<div class="bake"><span class="k">Bake at Home</span><span class="t">425° for 8 to 12 min</span>' +
        '<span class="s">Ask about our Pizza of the Week specials</span></div>'
      : "";   // TV 2: the stromboli bake line sits in the Strombolis section (Brian, Nov 24)
  }
  const CATER_QR = "../img/qr-catering.png";
  function todayCard() {
    const card = "";
    const banner = RS.settings.banner ? '<div class="s banner">' + esc(RS.settings.banner) + '</div>' : "";
    // Catering headline + message from the tablet, pinned here the whole
    // time catering is on for this TV (the window scene still rotates too).
    const c = liveCatering();
    // QR (QR Tiger dynamic code "Ludwig's TV - Catering Menu", https://qr1.be/B3J31V,
    // points at their CateringMenu_2026.pdf; retarget it in QR Tiger, no board change).
    const cater = c ? '<div class="cater"><div class="ctext"><div class="ck">Now Booking</div><div class="ch">' + esc(c.headline) + '</div>' +
      (c.message ? '<div class="cm">' + esc(c.message) + '</div>' : "") + '</div>' +
      '<div class="cqr"><img src="' + CATER_QR + '" alt="" onerror="this.parentNode.remove()"><span>Scan for the<br>catering menu</span></div></div>' : "";
    return card + banner + cater + '<div class="phone">Call Ahead<b>' + PHONE + '</b></div>';
  }
  function drawToday() { document.getElementById("today").innerHTML = todayCard(); }

  /* ---------- diagnostics (&debug=1 only) ---------- */
  let feedAt = 0;
  function diag() {
    if (!DEBUG) return;
    let d = document.getElementById("diag");
    if (!d) { d = document.createElement("div"); d.id = "diag"; stage.appendChild(d); }
    const bad = Object.keys(photoOk).filter(f => photoOk[f] === false);
    d.textContent = "ludwigs v1 tv" + tv + " | text " + Math.round(fitState.fs * 100) + "%" + (fitState.small ? " TOO SMALL" : "") +
      " pad " + fitState.pad + " | " + dayPart() + (wx ? " " + wx.f + "F" + (wx.wet ? " wet" : "") + " " + wx.src : " no weather") + (soupWeather() ? " SOUP" : "") + " | promos " + heroList.map(p => p.id).join(",") +
      " | feed " + (feedAt ? Math.round((Date.now() - feedAt) / 60000) + " min ago" : "saved copy") +
      (bad.length ? " | MISSING " + bad.join(",") : "") + (videoNote ? " | video " + videoNote : "") + (VIDEO_OFF ? " | video off" : "") + (STILL ? " | still" : "");
  }

  /* =====================================================================
     START
     ===================================================================== */
  document.getElementById("logo").src = LOGO;
  let lastPrices = null, renders = 0;
  RS.start(function () {
    const prev = lastPrices;
    lastPrices = Object.assign({}, RS.prices);
    if (++renders > 1) feedAt = Date.now();     // first draw is the saved copy
    drawMenu();
    drawToday();
    if (started) refreshHero();
    if (prev) Object.keys(RS.prices).filter(id => RS.prices[id] !== prev[id]).forEach(id =>
      document.querySelectorAll('.row[data-ids*="' + id + '"]').forEach(el => el.classList.add("pchanged")));
  });
  // Start at once: the wordmark card needs nothing from the network, and
  // the first food promo snaps in the moment its photo has loaded.
  /*
   * VIDEO LIST. Clips added through the GitHub inbox are listed in
   * video/videos.json (see .github/scripts/process_tv_videos.py). Read it
   * at start and every 10 minutes; keep the last good copy on the TV so
   * a network drop never empties the rotation.
   */
  const VIDEO_LIST_KEY = "ludwigs_tv_videos_v1";
  function useVideoList(list) {
    for (let i = PROMOS.length - 1; i >= 0; i--) if (PROMOS[i].fromList) PROMOS.splice(i, 1);
    (Array.isArray(list) ? list : []).forEach(v => {
      if (!v || !v.id || !v.video || !v.poster || (v.tv !== 1 && v.tv !== 2)) return;
      PROMOS.push({ id: v.id, tv: v.tv, type: "brand", footage: "stock", fromList: true,
        eyebrow: v.eyebrow || "", brandTitle: v.title || "Ludwig\u2019s",
        video: v.video, poster: v.poster, loop: false, seconds: Number(v.seconds) || 9, focus: "50% 50%" });
      if (v.tv === tv) preload(v.poster, VIDEO_DIR);
    });
  }
  function loadVideoList() {
    const bucket = Math.floor(Date.now() / 600000);
    return fetch(VIDEO_DIR + "videos.json?v=" + bucket, { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(list => { try { localStorage.setItem(VIDEO_LIST_KEY, JSON.stringify(list)); } catch (e) {} useVideoList(list); })
      .catch(() => { try { useVideoList(JSON.parse(localStorage.getItem(VIDEO_LIST_KEY) || "[]")); } catch (e) {} });
  }
  try { useVideoList(JSON.parse(localStorage.getItem(VIDEO_LIST_KEY) || "[]")); } catch (e) {}
  loadVideoList();
  setInterval(loadVideoList, 10 * 60 * 1000);


  /*
   * SHOWTIME. Full-screen reels, in boards/v2c/video. Stock footage, so
   * every reel is an unpriced brand spot: no item names, no prices.
   *   file      the reel (9 s, 1920x1080, made from 4K sources)
   *   layout    "full" (words over the bottom) or "split" (clip left,
   *             words right, for a single tall clip)
   *   hero      the window promo (PROMOS id) with the same footage. As the
   *             reel fades out, that clip is already playing in the window,
   *             so the reel hands off to it; then the rotation carries on.
   * Clock-synced: every SHOW_EVERY seconds one reel plays, the next reel
   * in the list each time. TV 2 runs half a cycle after TV 1.
   *   &show=0 turns it off, &show=ID loops one reel (preview),
   *   &showevery=N shortens the cycle (preview).
   */
  const SHOWS = [
    // Nov 23: no full-screen reels for now. "Pizza Night." and "Made Here." were
    // built from clips Brian rated 2 to 6, and the deli clip (7 in the window) did
    // not hold up full screen. Bar is 8+. Next reels come from real Ludwig's footage.
  ];
  const SHOW_SECONDS = 9;
  const SHOW_EVERY = Math.max(20, Number(params.get("showevery")) || 150);
  const SHOW_PARAM = params.get("show") || "";
  const SHOW_OFF = SHOW_PARAM === "0" || STILL || VIDEO_OFF;
  const showEl = document.getElementById("show");
  let showTimer = null, showVideo = null, showEnd = null, lastShowSlot = -1;
  function showList() {
    const mine = SHOWS.filter(s => s.tv === tv);
    const pin = SHOW_PARAM && SHOWS.filter(s => s.id === SHOW_PARAM);
    return pin && pin.length ? pin : mine;
  }
  function endShow(handoff) {
    clearTimeout(showEnd);
    if (handoff && handoff.hero && showEl.classList.contains("on")) forceHero(handoff.hero);
    showEl.classList.remove("on");
    const v = showVideo; showVideo = null;
    if (v) setTimeout(() => { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} }, 800);
    setTimeout(() => { if (!showVideo) showEl.innerHTML = ""; }, 800);
  }
  function playShow(s) {
    endShow();
    showEl.className = "show" + (s.layout === "split" ? " split" : "");
    showEl.innerHTML = '<video muted playsinline preload="auto"></video><div class="shade"></div>' +
      '<img class="logo" alt="" src="' + LOGO + '" onerror="this.remove()">' +
      '<div class="words"><div><div class="eyebrow"><span>' + esc(s.eyebrow) + '</span></div>' +
      '<div class="big">' + esc(s.title) + '</div><div class="line"></div></div>' +
      '<div class="call">Call Ahead<b>' + PHONE + '</b></div></div>';
    const v = showEl.querySelector("video");
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.disablePictureInPicture = true;
    showVideo = v;
    let shown = false;
    const give = setTimeout(() => { if (!shown && showVideo === v) endShow(); }, 4000);   // never started
    v.addEventListener("timeupdate", () => {
      if (shown || showVideo !== v || v.currentTime < 0.05) return;
      shown = true; clearTimeout(give);
      stopVideo();                              // one video at a time on the stick
      showEl.classList.add("on");
      showEnd = setTimeout(() => endShow(s), Math.max(1000, (SHOW_SECONDS - 0.7) * 1000));
    });
    v.addEventListener("ended", () => { if (showVideo === v) endShow(s); });
    v.addEventListener("error", () => { if (showVideo === v) endShow(); });
    v.src = VIDEO_DIR + s.id + ".mp4";
    const pr = v.play(); if (pr && pr.catch) pr.catch(() => { if (showVideo === v) endShow(); });
  }
  function scheduleShow() {
    clearTimeout(showTimer);
    const list = showList();
    if (SHOW_OFF || !list.length) return;
    if (SHOW_PARAM && SHOW_PARAM !== "0") {           // preview: loop one reel
      playShow(list[0]); showTimer = setTimeout(scheduleShow, (SHOW_SECONDS + 3) * 1000); return;
    }
    const t = Date.now() / 1000 + (tv === 2 ? SHOW_EVERY / 2 : 0);
    const slot = Math.floor(t / SHOW_EVERY), into = t - slot * SHOW_EVERY;
    // Never in the first minute after power-on: the menu shows first.
    // A late timer (busy or throttled browser) still plays the slot's reel,
    // as long as most of it is left; each slot plays at most once.
    if (slot !== lastShowSlot && into < SHOW_SECONDS - 3 && Date.now() - bootAt > 60000) {
      lastShowSlot = slot;
      playShow(list[slot % list.length]);
    }
    showTimer = setTimeout(scheduleShow, Math.max(500, (SHOW_EVERY - into) * 1000 + 50));
  }


  /*
   * SELF-UPDATE. Fully Kiosk keeps this page open for days, so it never sees
   * a new version on its own. Every 2 minutes, fetch this page fresh (no
   * cache) and compare it with the copy we started from; if it changed,
   * reload with a cache-busting stamp. Same URL and ?tv=, nothing to touch
   * on the stick. Skipped mid-reel so a reload never cuts a video off.
   * (Verified on Nov 20, 2026.)
   */
  (function selfUpdate() {
    const here = location.pathname;
    let base = null;
    const grab = () => fetch(here + "?nc=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : null).catch(() => null);
    grab().then(t => { base = t; });
    setInterval(() => {
      grab().then(t => {
        if (!t || !base) { if (t && !base) base = t; return; }
        if (t === base) return;
        const showing = document.getElementById("show");
        if (showing && showing.classList.contains("on")) return;      // after the reel
        const q = new URLSearchParams(location.search);
        q.set("rv", String(Date.now()));
        location.replace(here + "?" + q.toString());
      });
    }, 2 * 60 * 1000);
  })();

  bootAt = Date.now(); started = true;
  if (pendingPhotos === 0) photosSettled = true;
  showPromo(true);
  scheduleShow();
  setTimeout(settlePhotos, 1500);      // slow connection: go with what has loaded
  // Fonts are only fetched when first used, so ask for them up front and
  // measure everything again when they (and the page) are in.
  const wanted = ['600 30px "Barlow SC"', '700 30px "Barlow SC"', '500 30px "Barlow SC"', '600 30px "Oswald"', '500 16px "Oswald"', 'italic 900 66px "Playfair Display"'];
  const remeasure = () => { fit(); PROMOS.concat(BRAND_CARD).forEach(p => { if (slides[p.id]) dressSlide(p, slides[p.id]); }); };
  if (document.fonts && document.fonts.load) Promise.all(wanted.map(f => document.fonts.load(f).catch(() => null))).then(remeasure);
  window.addEventListener("load", remeasure);
  setTimeout(remeasure, 5000);
  // Midnight: today's special and the daily promos change.
  setInterval(drawToday, 10 * 60 * 1000);
})();
</script>
