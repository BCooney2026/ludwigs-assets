<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludwig's Village Market Menu</title>
<!--
  LUDWIG'S VILLAGE MARKET MENU BOARD (boards/v1/)
  Built from the Rocco's v2c engine. Shared player: ../signage.js.
    menu.html?tv=1   Pizza: build your own, white, red, special sauces
    menu.html?tv=2   Deli & Kitchen: sandwiches, strombolis,
                     Italian dinners, pasta specialties
  Options:  &motion=0   still pictures only (no movement)
            &promo=ID   hold one scene on screen (ID from PROMOS)
            &day=2      preview another weekday (1 = Monday)
            &hour=16    preview another time of day (shop hour, 0-23)
            &wx=cold    preview cold/wet weather (wx=mild for not cold)
            &video=0    never play video, stills only
            &show=0     no full-screen reels
            &test86=L040,L052   preview sold out
            &debug=1    troubleshooting box (never leave it on)

  CONTENT RULES (Brian)
  - Every item and every price stays on the board. If it does not fit,
    fix spacing, wording or columns. Never cut an item.
  - Prices come from Sheet IDs (L001 and up) through ../signage.js.
    Nothing is typed here. Prices always show cents.
  - Only claims Ludwig's own menus back up. Sources: Sandwich_Menu_26.doc
    (= 2026_SandwichMenu.pdf on their site), the pizza TV board,
    LudwigsPizzaMenu2023.pdf.
  - One color, one meaning: green = section marks, gold = prices and
    labels, red = SOLD OUT only.
-->
<style>
  @font-face { font-family: "Barlow SC"; font-weight: 500; font-display: swap; src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow SC"; font-weight: 600; font-display: swap; src: url("fonts/barlow-semi-condensed-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow SC"; font-weight: 700; font-display: swap; src: url("fonts/barlow-semi-condensed-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Oswald"; font-weight: 500; font-display: swap; src: url("fonts/oswald-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Oswald"; font-weight: 600; font-display: swap; src: url("fonts/oswald-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 900; font-display: swap; src: url("fonts/playfair-display-latin-900-italic.woff2") format("woff2"); }

  :root {
    --bg: #141210;
    --surface: #24201b;
    --ivory: #fbf5ea;
    --ivory-2: #d9ccb8;
    --ivory-3: rgba(232, 222, 206, .8);
    --tomato: #c8402e;          /* SOLD OUT only */
    --green: #79a34a;           /* section marks (pineapple green from the logo) */
    --gold: #d2aa5f;
    --price: #f3cf84;
    --rule: rgba(216, 171, 105, .3);
    --hair: rgba(255, 245, 233, .13);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }

  /* Fixed 1920x1080 stage; ../signage.js scales and centers it on the TV. */
  .stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: center center; color: var(--ivory); background: var(--bg);
    font-family: "Barlow SC", "Arial Narrow", Arial, sans-serif;
    transition: margin .8s ease; -webkit-font-smoothing: antialiased; --fs: 1; --pad: 5; }
  .env { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(1100px 800px at 72% 30%, rgba(255, 214, 160, .05), transparent 62%),
      linear-gradient(180deg, #1d1915 0%, #171411 50%, #110f0d 100%); }
  .env::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(130% 120% at 50% 45%, transparent 58%, rgba(0, 0, 0, .55) 100%); }

  .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.005em; }
  .price sup { font-size: .52em; vertical-align: top; position: relative; top: .14em; margin-left: 1px; }

  /* =====================================================================
     MENU (right). Stable: nothing here moves except a changed price.
     ===================================================================== */
  .menu { position: absolute; left: 490px; right: 0; top: 0; bottom: 0; padding: 14px 30px 8px 38px;
    display: grid; column-gap: 32px; grid-template-rows: minmax(0, 1fr) auto; }
  /* Bake strip: how to bake at home, one line across the bottom of every
     column (moved out of the Today card, Brian Nov 24). */
  .bake { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 26px; margin: 8px -12px 0; padding: 4px 22px 4px 24px;
    background: linear-gradient(90deg, #2a2420, var(--surface) 60%, rgba(37, 32, 28, .6)); border-radius: 4px;
    border-left: 7px solid var(--green); box-shadow: 0 8px 22px rgba(0, 0, 0, .32); white-space: nowrap; }
  .bake .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .26em; text-transform: uppercase; color: var(--green); }
  .bake .t { font-weight: 700; font-size: 27px; line-height: 1; color: var(--ivory); }
  .menu.nostrip { padding-top: 22px; padding-bottom: 22px; grid-template-rows: minmax(0, 1fr); }
  /* Bake line inside a section (TV 2 Strombolis). */
  .sizes-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .bake-in { display: flex; align-items: baseline; gap: 12px; margin-top: calc(8px * var(--fs)); padding: calc(3px * var(--fs)) 14px;
    border-left: 4px solid var(--green); background: rgba(255, 245, 233, .05); border-radius: 0 3px 3px 0; white-space: nowrap; }
  .bake-in .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: calc(15px * var(--fs)); letter-spacing: .22em; text-transform: uppercase; color: var(--green); }
  .bake-in .t { font-weight: 700; font-size: calc(24px * var(--fs)); color: var(--ivory); }
  .bake .s { margin-left: auto; font-size: 19px; font-weight: 500; color: var(--ivory-3); }
  .col { min-height: 0; display: flex; flex-direction: column; gap: calc(20px * var(--fs)); }

  .sec { display: flex; flex-direction: column; flex: none; }
  /* Category plate: the fastest thing to find from across the room. */
  .sec-h { margin: 0 -12px; padding: calc(5px * var(--fs)) 12px calc(4px * var(--fs)) 20px; overflow: hidden; position: relative;
    background: linear-gradient(90deg, #2d2621, var(--surface) 70%, rgba(37, 32, 28, .55));
    border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, .28);
    font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 600; text-transform: uppercase;
    font-size: calc(31px * var(--fs)); line-height: 1.15; letter-spacing: .13em; color: var(--ivory); white-space: nowrap; }
  .sec-h::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--green); border-radius: 4px 0 0 4px; }
  .sec .bh-logo { display: block; width: calc(250px * var(--fs)); max-width: 100%; height: auto; aspect-ratio: 900 / 203; margin: calc(12px * var(--fs)) 0 0; }
  .sec .by { font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    font-size: calc(16px * var(--fs)); color: var(--gold); margin-top: calc(10px * var(--fs)); }
  .sec .meta { font-size: calc(19px * var(--fs)); color: var(--gold); margin-top: calc(8px * var(--fs)); line-height: 1.2; font-weight: 500; font-style: italic; }
  .sec .by + .meta { margin-top: 2px; }

  .rows { margin-top: calc(4px * var(--fs)); display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: baseline;
    padding: calc(var(--pad) * 1px * var(--fs)) 0; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row .n { font-weight: 600; font-size: calc(30px * var(--fs)); line-height: 1.06; overflow-wrap: break-word; }
  .row .n .star { color: var(--green); font-size: .7em; margin-right: 6px; position: relative; top: -.14em; }
  /* Two-line names: the price sits on the LAST line, next to the end of the
     name (Bob's call, Nov 20). "end" is the fallback for old WebViews. */
  .row .price { font-size: calc(31px * var(--fs)); text-align: right; color: var(--price); align-self: end; align-self: last baseline; }
  /* Descriptions split into even lines, so one word ("crust", "salsa") never
     dangles alone on line two. Older WebViews ignore it and wrap as before. */
  .row .d { grid-column: 1 / -1; font-weight: 500; font-size: calc(20px * var(--fs)); line-height: 1.12; color: var(--ivory-3); margin-top: 1px; text-wrap: balance; }
  /* Sandwich number (#1 to #17): small gold figure ahead of the name. */
  .row .n .no { font-family: "Oswald", sans-serif; font-weight: 500; font-size: .74em; color: var(--gold); margin-right: 8px; letter-spacing: .02em; position: relative; top: -.04em; }
  /* "Add chicken +4.00" and other add-on lines under a description. */
  .row .d .add { color: var(--gold); font-weight: 600; white-space: nowrap; }
  .row .d .add .price { color: var(--price); font-size: 1em; align-self: auto; }
  .row .d .add .price sup { font-size: .6em; }
  /* Section price strip (one price for every item in the section). */
  .sec .sizes { margin-top: calc(8px * var(--fs)); }
  .sizes span { font-size: calc(30px * var(--fs)); }
  .sizes span.plus { font-size: calc(22px * var(--fs)); color: var(--ivory-2); font-weight: 600; }
  .row.note .n { white-space: normal; line-height: 1.2; }
  .row.note .n b { color: var(--gold); font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: .9em; margin-right: 6px; }
  .flavors .plus { color: var(--price); font-weight: 700; font-size: .86em; margin-left: 4px; }
  .flavors .plus sup { font-size: .55em; vertical-align: top; position: relative; top: .14em; }
  .flavors .sub-h { flex-basis: 100%; font-family: "Oswald", sans-serif; font-weight: 500; font-size: .7em; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-top: calc(6px * var(--fs)); }
  .flavors .sub-h::before { content: none; }
  .row.sub .n { font-weight: 500; color: #efe4d4; padding-left: 18px; }
  .row.note .n, .row.note .price { font-size: calc(20px * var(--fs)); font-weight: 500; color: var(--ivory-3); }
  .row.hot .n { color: #fff; } .row.hot .price { color: #ff6a55; }
  .row .lbl { font-family: "Oswald", sans-serif; font-weight: 500; font-size: .56em; letter-spacing: .14em; color: var(--gold); margin: 0 5px 0 12px; text-transform: uppercase; }
  .row .lbl:first-child { margin-left: 0; }
  .row.wide .price { grid-column: 1 / -1; text-align: left; margin-top: 2px; }
  /* 86'd for today (tablet): name dims, SOLD OUT tag where the price was. */
  .row.out .n, .row.out .d { opacity: .45; }
  .out-tag { display: inline-block; font-family: "Oswald", sans-serif; font-weight: 600; font-size: .6em; letter-spacing: .14em;
    text-transform: uppercase; color: #fff; background: var(--tomato); padding: .12em .5em .08em; border-radius: 4px; white-space: nowrap; }
  .tbl .row .out-tag { font-size: .5em; letter-spacing: .08em; }
  /* A price that just changed on the tablet pulses three times, then sits still. */
  .row.pchanged .price { animation: pglow 2.4s ease 3; }
  @keyframes pglow { 50% { color: #fff; text-shadow: 0 0 18px var(--gold); } }

  /* Price table (Classics): MED / LG columns */
  .tbl .head { display: grid; grid-template-columns: minmax(0, 1fr) calc(78px * var(--fs)) calc(78px * var(--fs)); margin-top: calc(10px * var(--fs)); }
  .tbl .head span { font-family: "Oswald", sans-serif; font-weight: 500; font-size: calc(17px * var(--fs)); letter-spacing: .2em; color: var(--gold); text-align: right; text-transform: uppercase; }
  .tbl .rows { margin-top: 0; }
  .tbl .row { grid-template-columns: minmax(0, 1fr) calc(78px * var(--fs)) calc(78px * var(--fs)); }
  .tbl .row .price.one { grid-column: 2 / 4; }

  .tops { margin-top: calc(10px * var(--fs)); font-size: calc(21px * var(--fs)); line-height: 1.22; color: var(--ivory-2); font-weight: 500; }
  .tops b { color: var(--ivory); font-weight: 700; font-size: 1.14em; }
  .tops b .price, .tops .price { color: var(--price); }
  .tops .sep { color: var(--green); margin: 0 7px; }
  .tops .lbl { font-family: "Oswald", sans-serif; font-weight: 500; font-size: .62em; letter-spacing: .14em; color: var(--gold); margin: 0 5px 0 14px; text-transform: uppercase; }
  .tops-h { font-family: "Oswald", sans-serif; font-weight: 500; font-size: calc(16px * var(--fs)); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: calc(10px * var(--fs)) 0 calc(2px * var(--fs)); }

  .sizes { display: flex; flex-wrap: wrap; gap: 0 calc(18px * var(--fs)); margin-top: calc(10px * var(--fs)); }
  .sizes span { font-weight: 700; font-size: calc(30px * var(--fs)); white-space: nowrap; color: var(--price); }
  .sizes em { font-style: normal; font-family: "Oswald", sans-serif; font-weight: 500; font-size: .56em; letter-spacing: .16em; color: var(--gold); margin-right: 6px; text-transform: uppercase; }
  .flavors { margin-top: calc(6px * var(--fs)); display: flex; flex-wrap: wrap; gap: calc(3px * var(--fs)) calc(16px * var(--fs)); font-weight: 600; font-size: calc(25px * var(--fs)); line-height: 1.12; }
  .flavors span { white-space: nowrap; }
  .flavors span::before { content: "\2022"; color: var(--green); margin-right: 7px; }

  /* =====================================================================
     HERO (left). The only part of the board that moves.
     ===================================================================== */
  .hero { position: absolute; left: 0; top: 0; bottom: 0; width: 490px; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0f0d0b 0%, #171310 46%, #0d0b0a 100%);
    box-shadow: 1px 0 0 var(--rule), 24px 0 60px rgba(0, 0, 0, .35); }
  /* Key light from the top left and the "table" the food sits on. */
  .hero::before { content: ""; position: absolute; left: -160px; top: -60px; width: 860px; height: 760px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 196, 128, .17), rgba(255, 170, 100, .06) 55%, transparent 75%); }
  .hero-logo { position: relative; z-index: 3; height: 108px; flex: none; }
  .hero-logo img { position: absolute; left: 18px; top: 10px; width: 150px; height: auto; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .7)); }

  .slides { position: relative; flex: 1; min-height: 0; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; }
  .slide.on { opacity: 1; }
  .slide.out { opacity: 0; transition: opacity 1.1s ease; }

  .art { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .plate { position: relative; flex: none; }
  .plate img { display: block; width: 100%; height: auto; position: relative; z-index: 1;
    filter: drop-shadow(0 30px 34px rgba(0, 0, 0, .6)) saturate(1.08) contrast(1.05); }
  /* Soft contact shadow so the food sits on something instead of floating. */
  .plate::before { content: ""; position: absolute; left: 6%; right: 6%; bottom: -5%; height: 16%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .7), transparent); filter: blur(8px); }
  /* One light sweep across the food as it arrives (shaped by the photo itself). */
  .sweep { position: absolute; inset: 0; z-index: 2; opacity: 0;
    background: linear-gradient(105deg, transparent 42%, rgba(255, 236, 205, .5) 50%, transparent 58%) no-repeat;
    background-size: 300% 100%; background-position: 120% 0;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }

  .copy { flex: none; padding: 0 28px 18px 36px; position: relative; z-index: 2; }
  .eyebrow { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .3em;
    color: var(--green); font-size: 18px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .eyebrow::after { content: ""; flex: 1; max-width: 120px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
  .eyebrow .badge { background: var(--green); color: #fff; letter-spacing: .2em; padding: 4px 10px 3px 12px; border-radius: 3px; font-size: 16px; }
  .title { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic; font-size: 66px;
    line-height: .95; letter-spacing: -.012em; color: var(--ivory); margin-top: 10px; text-shadow: 0 6px 34px rgba(0, 0, 0, .55); }
  .desc { font-size: 24px; color: var(--ivory-2); margin-top: 12px; font-weight: 500; line-height: 1.2; }
  .pricebar { display: flex; align-items: center; gap: 18px; margin-top: 12px; }
  .pricebar i { display: block; width: 46px; height: 3px; background: var(--green); transform-origin: left center; }
  .pricebar .price { font-size: 78px; line-height: 1; color: var(--ivory); }
  .pricebar .price sup { color: var(--price); }
  .pricebar small { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }

  /* Type-only promo (a special with no real photo yet): price medallion */
  .medal { width: 250px; height: 250px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 34% 28%, #e85a47, var(--green) 48%, #972a1e);
    box-shadow: 0 26px 60px rgba(0, 0, 0, .6), inset 0 0 0 3px rgba(255, 255, 255, .13), 0 0 0 7px rgba(216, 171, 105, .34); color: #fff; }
  .medal .price { font-size: 96px; line-height: 1; }
  .medal small { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 19px; letter-spacing: .26em; text-transform: uppercase; margin-top: 6px; opacity: .9; }
  /* Brand card (Boar's Head, Ludwig's logo, QR codes) */
  .brandart { width: 430px; }
  .brandart img { display: block; width: 100%; height: auto; filter: drop-shadow(0 12px 26px rgba(0, 0, 0, .6)); }
  /* Live scenes set on the tablet: soups list, special price medal (gold = price). */
  .soupcard { position: relative; z-index: 1; width: 426px; align-self: center; }
  /* Dimmed photo of one of today's soups behind the list (fades out top and bottom). */
  .soupbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .32;
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 22%, #000 70%, transparent); }
  .soupcard ul { list-style: none; margin: 0; padding: 0; --sz: 44px; }
  .soupcard li { display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    padding: calc(var(--sz) * .3) 0; border-top: 1px solid var(--hair); }
  .soupcard li:first-child { border-top: 0; }
  .soupcard .nm { flex: 1; min-width: 0; font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic;
    font-size: var(--sz); line-height: 1.02; color: var(--ivory); text-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
  .soupcard .tg { flex: none; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 16px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .slide.on .soupcard li { animation: drop .7s var(--ease) both; }
  /* No photo for any of today's soups: bigger centered names between two
     gold rules, over a warm glow, so one or two soups fill the window. */
  .soupcard.solo { text-align: center; padding: 46px 0; }
  .soupcard.solo::before { content: ""; position: absolute; inset: -60px -40px; z-index: -1;
    background: radial-gradient(closest-side, rgba(216, 171, 105, .22), rgba(216, 171, 105, .07) 60%, transparent); }
  .soupcard.solo ul::before, .soupcard.solo ul::after { content: ""; display: block; width: 140px; height: 2px; margin: 0 auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .soupcard.solo ul::before { margin-bottom: 34px; }
  .soupcard.solo ul::after { margin-top: 34px; }
  .soupcard.solo li { flex-direction: column; align-items: center; gap: 10px; }
  .soupcard.solo .nm { overflow-wrap: break-word; }
  .slide.on .soupcard.solo ul::before, .slide.on .soupcard.solo ul::after { animation: fadein 1.2s ease .4s both; }
  .medal.gold { background: radial-gradient(circle at 34% 28%, #f8e2ad, var(--gold) 52%, #8c6a2c); color: #1d160e; }
  .medal.gold .price sup { color: #1d160e; }

  /* ---- the 12 second sequence. Everything is opacity / transform. ---- */
  /*
   * The sequence. The food, the name and the price are there from the
   * first frame of a promo (they come in together with the cross-fade),
   * so a glance at any moment reads as a finished ad. Only the light
   * sweep, the red line and the slow push-in happen afterwards.
   * Everything is opacity / transform.
   */
  .slide.on { animation: fadein .9s ease both; }
  .slide.on .plate, .slide.on .medal, .slide.on .brandart, .slide.on .clip { animation: arrive 1.1s var(--ease) both; }
  .slide.on .zoom { animation: pushin var(--dur, 12s) linear both; }
  .slide.on .sweep { animation: sweep 1.5s ease-in-out .9s both; }
  /* Photo first, then the words drop in: eyebrow, name, description, price. */
  .slide.on .eyebrow { animation: drop .7s var(--ease) 1.1s both; }
  .slide.on .title { animation: drop .8s var(--ease) 1.3s both; }
  .slide.on .desc { animation: drop .7s var(--ease) 1.55s both; }
  .slide.on .pricebar { animation: drop .8s var(--ease) 1.8s both; }
  .slide.on .pricebar i { animation: draw .7s var(--ease) 2.4s both; }
  /* Power-on frame: no animation at all, so it cannot sit invisible while
     a slow or background browser waits to run its first animation frame. */
  .slide.on.snap, .slide.on.snap * { animation: none !important; }
  /* Once a promo has faded in, drop the fade so it can never be left half-way. */
  .slide.on.settled { animation: none; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes arrive { from { transform: translateY(14px) scale(.965); } to { transform: none; } }
  @keyframes pushin { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes sweep { 0% { opacity: 1; background-position: 120% 0; } 99% { opacity: 1; background-position: -20% 0; } 100% { opacity: 0; background-position: -20% 0; } }
  @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /*
   * Video promo. The still photo is always underneath and always
   * visible; the clip only fades in over it once it is really playing,
   * and fades back out if it stalls or fails. Nobody ever sees a black
   * box or a spinner.
   */
  .clip { position: absolute; left: 0; right: 0; top: -108px; bottom: 0; overflow: hidden; background: #0f0d0b; }
  .clip img, .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50% 50%); display: block; }
  .clip video { opacity: 0; transition: opacity .7s ease; }
  .slide.on .clip.photo > img:first-child { animation: pushin 11s linear both; transform-origin: 50% 45%; }
  /* A brand logo on a photo scene (e.g. Proudly Featuring Boar's Head):
     sits low on the photo and drops in just before the name. */
  .clip .clip-logo { position: absolute; inset: auto auto 26px 34px; width: 270px; height: auto; object-fit: contain; z-index: 2;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .8)); }
  .slide.on .clip .clip-logo { animation: drop .7s var(--ease) .9s both; }
  /* Photo credit, required by CC BY licences: small and quiet in the corner. */
  .clip .clip-credit { position: absolute; right: 12px; bottom: 8px; z-index: 2; font-family: "Barlow Semi Condensed", sans-serif;
    font-size: 13px; letter-spacing: .02em; color: rgba(244, 236, 221, .5); text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  @keyframes pushin { from { transform: scale(1.0); } to { transform: scale(1.09); } }
  .clip video.live { opacity: 1; }
  .clip::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(15, 13, 11, .62) 0%, transparent 20%, transparent 66%, #14110f 100%); }
  .slide.has-clip .art { align-items: stretch; }

  /*
   * Feature scene (feature: "bh"): Ludwig's x Proudly Featuring Boar's Head.
   * Dark photo with a slow push-in, gold embers rising, Ludwig's logo drops in,
   * a gold rule draws, the Boar's Head lockup lands from blur to sharp, then a
   * gold light sweeps across it every few seconds. The lockup is never split
   * or recolored (brand mark stays intact). Everything is opacity / transform.
   */
  .feat { position: absolute; left: 0; right: 0; top: -108px; bottom: 0; z-index: 4; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 6px; pointer-events: none; }
  .feat-glow { position: absolute; left: 50%; top: 40px; width: 620px; height: 400px; margin-left: -310px; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 190, 90, .30), rgba(216, 171, 105, .10) 55%, transparent 78%); }
  .feat-rocco { width: 230px; margin-bottom: 0; height: auto; position: relative; filter: drop-shadow(0 10px 26px rgba(0, 0, 0, .85)); }
  .feat-rule { position: relative; display: flex; align-items: center; gap: 12px; width: 360px; margin: 6px 0 14px; }
  .feat-rule i { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); transform-origin: right center; }
  .feat-rule i + b + i { background: linear-gradient(90deg, var(--gold), transparent); transform-origin: left center; }
  .feat-rule b { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 14px rgba(255, 200, 110, .9); }
  .feat-bh { position: relative; width: 410px; }
  .feat-bh img { display: block; width: 100%; height: auto; filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .9)); }
  .feat-bh .shine { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255, 226, 160, .95) 50%, transparent 60%) no-repeat;
    background-size: 300% 100%; background-position: 120% 0;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .embers { position: absolute; inset: 0; overflow: hidden; z-index: 1; pointer-events: none; }
  .embers span { position: absolute; bottom: -10px; width: var(--s, 4px); height: var(--s, 4px); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, #ffe4a8 0%, #f0a640 45%, rgba(240, 120, 40, 0) 72%); }
  .slide.feature .clip::after { background: linear-gradient(180deg, rgba(10, 8, 7, .78) 0%, rgba(10, 8, 7, .55) 45%, transparent 66%, #14110f 100%); }
  .slide.feature.on .feat-glow { animation: fadein 1.2s ease .3s both, glow 4s ease-in-out 1.5s infinite; }
  .slide.feature.on .feat-rocco { animation: drop .9s var(--ease) .4s both; }
  .slide.feature.on .feat-rule i { animation: draw .8s var(--ease) 1.1s both; }
  .slide.feature.on .feat-rule b { animation: pop .5s var(--ease) 1.2s both; }
  .slide.feature.on .feat-bh { animation: land 1.1s var(--ease) 1.5s both; }
  .slide.feature.on .feat-bh .shine { animation: shine 4s ease-in-out 2.7s infinite; }
  .slide.feature.on .embers span { animation: ember var(--t, 6s) linear var(--d, 0s) infinite; }
  .slide.feature.on .eyebrow { animation-delay: 2.6s; }
  .slide.feature.on .title { animation-delay: 2.8s; }
  .slide.feature.on .desc { animation-delay: 3.05s; }
  /* Ludwig's logo is already in the scene, so the corner logo steps aside. */
  .hero-logo img { transition: opacity .8s ease; }
  .hero:has(.slide.feature.on) .hero-logo img, .hero:has(.slide.logo-card.on) .hero-logo img { opacity: 0; }
  @keyframes glow { 50% { transform: scale(1.12); opacity: .7; } }
  @keyframes pop { from { transform: rotate(45deg) scale(0); } to { transform: rotate(45deg) scale(1); } }
  @keyframes land { 0% { opacity: 0; transform: scale(1.3); filter: blur(14px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: none; } }
  @keyframes shine { 0% { opacity: 1; background-position: 120% 0; } 40% { opacity: 1; background-position: -20% 0; } 41%, 100% { opacity: 0; background-position: -20% 0; } }
  @keyframes ember { 0% { opacity: 0; transform: translate(0, 0); } 12% { opacity: .95; } 80% { opacity: .55; }
    100% { opacity: 0; transform: translate(var(--x, 20px), -820px); } }
  /* Ludwig's brand card: the logo plus a line of words. */
  .wordmark { text-align: center; }
  .wordmark img { display: block; width: 360px; height: auto; margin: 0 auto; filter: drop-shadow(0 16px 34px rgba(0, 0, 0, .7)); }
  .wordmark b { display: block; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 900; font-size: 104px; line-height: .9; color: var(--ivory); text-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
  .wordmark span { display: block; margin-top: 14px; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--gold); }
  .slide.on .wordmark { animation: arrive 1.1s var(--ease) both; }

  /* Rotation ticks: one per promo, the lit one is on screen.
     Hidden Nov 21 (Brian: lose the lines). Delete "display: none" to bring them back. */
  .ticks { flex: none; display: none; gap: 8px; padding: 20px 36px 0; height: 40px; }
  .ticks i { flex: 1; max-width: 46px; height: 3px; border-radius: 2px; background: rgba(255, 245, 233, .16); transition: background .6s ease; }
  .ticks i.on { background: var(--gold); }

  /* Today card: always on screen, never part of the rotation. */
  .today { flex: none; margin: 0 24px 22px; padding: 16px 22px 16px; background: var(--surface);
    border-left: 5px solid var(--green); border-radius: 0 4px 4px 0; box-shadow: 0 12px 30px rgba(0, 0, 0, .4); position: relative; z-index: 3; }
  .today .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .26em; text-transform: uppercase; color: var(--green); }
  .today .t { font-weight: 700; font-size: 30px; line-height: 1.1; margin-top: 5px; display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .today .t .price { color: var(--price); font-size: 32px; }
  .today .s { font-size: 20px; color: var(--ivory-3); margin-top: 3px; font-weight: 500; line-height: 1.2; }
  .today .s.banner { color: var(--ivory); margin-top: 8px; }
  /* Catering line from the tablet: gold label, ivory headline. */
  /* Catering panel (tablet headline + message): its own warm, gold-trimmed
     panel across the top of the Today card, headline in the slide serif, and a
     slow gold sheen so it catches the eye (Brian: the plain version got missed). */
  .today .cater { position: relative; overflow: hidden; margin: -16px -22px 14px -27px; padding: 17px 22px 18px 22px; border-left: 5px solid var(--gold);
    background: radial-gradient(130% 150% at 0% 0%, rgba(226, 182, 100, .34), transparent 58%),
                linear-gradient(135deg, #5c2a1e 0%, #3a1b14 50%, #211612 100%);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(210, 170, 95, .18);
    border-top: 2px solid var(--gold); border-bottom: 1px solid rgba(210, 170, 95, .45); border-radius: 0 4px 0 0; }
  .today .cater:last-child { margin-bottom: -16px; border-radius: 0 4px 4px 0; }
  .today .cater::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255, 226, 160, .26) 50%, transparent 62%) 120% 0 / 250% 100% no-repeat;
    animation: shine 9s ease-in-out 2s infinite; }
  .today .cater { display: flex; align-items: center; gap: 16px; }
  .today .cater .ctext { flex: 1; min-width: 0; }
  .today .cater .cqr { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; }
  .today .cater .cqr img { width: 112px; height: 112px; padding: 6px; background: #fff8ec; border-radius: 6px; image-rendering: pixelated;
    box-shadow: 0 0 0 2px rgba(210, 170, 95, .85), 0 8px 18px rgba(0, 0, 0, .45); }
  .today .cater .cqr span { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold); text-align: center; line-height: 1.25; }
  .today .cater .ck { display: flex; align-items: center; gap: 12px; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .today .cater .ck::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(210, 170, 95, .8), transparent); }
  .today .cater .ch { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic; font-size: 32px; line-height: 1.05;
    margin-top: 8px; color: #fff4df; text-shadow: 0 2px 14px rgba(0, 0, 0, .55), 0 0 22px rgba(210, 170, 95, .25); }
  .today .cater .cm { font-size: 19px; color: #ecdcc4; margin-top: 8px; font-weight: 500; line-height: 1.2; }
  .today .phone { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline;
    font-family: "Oswald", sans-serif; letter-spacing: .18em; text-transform: uppercase; font-size: 15px; color: var(--ivory-3); }
  .today .phone:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .today .cater + .phone { margin-top: 0; padding-top: 0; border-top: 0; }
  /* Key for the stars in the menu: Ludwig's favorites (none picked yet). */
  .today .favkey { margin-top: 10px; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 17px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--gold); }
  .eyebrow .favstar { color: var(--green); font-weight: 400; letter-spacing: 0; margin-right: 2px; }
  .today .favkey span { color: var(--green); letter-spacing: 0; margin-right: 4px; }
  .today .phone b { font-family: "Barlow SC", sans-serif; letter-spacing: .01em; font-size: 30px; color: var(--ivory); font-weight: 700; }


  /* =====================================================================
     SHOWTIME: a full-screen video takeover. Every few minutes one 9 s
     reel (1920x1080, cut and graded offline from 4K sources) fills the
     whole TV, then the menu comes straight back. The two TVs take turns
     so one menu is always readable. The layer only appears once the
     reel is really playing; if it cannot play, nothing changes.
     ===================================================================== */
  .show { position: absolute; inset: 0; z-index: 50; background: #0b0908; opacity: 0; pointer-events: none;
    transition: opacity .7s ease; }
  .show.on { opacity: 1; }
  .show video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .show .shade { position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(10, 8, 7, .92) 0%, rgba(10, 8, 7, .55) 26%, transparent 48%),
                linear-gradient(180deg, rgba(10, 8, 7, .55) 0%, transparent 18%); }
  .show .logo { position: absolute; left: 48px; top: 30px; width: 320px; height: auto; filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .7)); }
  .show .words { position: absolute; left: 96px; right: 96px; bottom: 82px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .show .eyebrow { font-size: 24px; letter-spacing: .42em; }
  .show .eyebrow::after { max-width: 200px; }
  .show .big { font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic; font-size: 150px; line-height: .92;
    letter-spacing: -.015em; color: var(--ivory); margin-top: 14px; text-shadow: 0 10px 50px rgba(0, 0, 0, .7); white-space: nowrap; }
  .show .line { width: 120px; height: 5px; background: var(--green); margin-top: 26px; transform-origin: left center; }
  .show .call { text-align: right; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .24em; font-size: 20px; color: var(--gold); flex: none; }
  .show .call b { display: block; font-family: "Barlow SC", sans-serif; letter-spacing: .01em; font-size: 54px; color: var(--ivory); font-weight: 700; margin-top: 4px; }
  /* Split layout: a single tall clip on the left, the words on the right. */
  .show.split .shade { background: linear-gradient(90deg, transparent 0%, transparent 34%, rgba(15, 13, 11, .0) 39.6%, #0f0d0b 40%); }
  .show.split .words { left: 860px; right: 90px; top: 0; bottom: 0; flex-direction: column; align-items: flex-start; justify-content: center; gap: 70px; }
  .show.split .big { font-size: 128px; white-space: normal; }
  .show.split .call { text-align: left; }
  .show.split .logo { left: auto; right: 70px; }
  .show.on .eyebrow, .show.on .big { animation: rise 1s var(--ease) .25s both; }
  .show.on .line { animation: draw .8s var(--ease) .8s both; }
  .show.on .call { animation: rise 1s var(--ease) .45s both; }
  .show.on video { animation: settle 9s linear both; }
  @keyframes settle { from { transform: scale(1.045); } to { transform: scale(1); } }

  /* Still mode (&motion=0 or the device asks for reduced motion) */
  .stage.still .slide.on, .stage.still .slide.on * { animation: none !important; }
  .stage.still .slide.out { transition: none; }
  .stage.still .row.pchanged .price { animation: none; }

  #diag { position: absolute; left: 10px; bottom: 10px; z-index: 99; background: #ff0; color: #000; font: bold 20px monospace; padding: 8px 10px; }
</style>

<div class="stage" id="stage">
  <div class="env"></div>
  <div class="hero" id="hero">
    <div class="hero-logo"><img id="logo" alt="" onerror="this.style.display='none'"></div>

</div>
<script src="../signage.js?v=7"></script>
<script>
(function () {
  "use strict";
  const IMG = "../img/";               // real photos and logos, shared by both TVs
  const LOGO = IMG + "ludwigs-logo.png"; // keyed from Ludwig's own board art
  const PHONE = "610-458-0700";
  const PROMO_SECONDS = 10; const SLOT_MINUTES = 10;            // default time on screen per promo
  const FS_FLOOR = 0.9;                // below this the board is flagged "small"
  const PAD_BASE = 5, PAD_MIN = 2, PAD_MAX = 16; // row spacing (px above and below each row)
  const params = new URLSearchParams(location.search);
  const tv = String(params.get("tv") || "1") === "2" ? 2 : 1;
  const DEBUG = params.get("debug") === "1";
  const VIDEO_DIR = "video/";          // clips live in boards/v1/video
  const VIDEO_OFF = params.get("video") === "0";
  const PIN = params.get("promo") || "";
  const HOUR_TEST = params.get("hour");                   // preview a time of day
  const WX_TEST = params.get("wx");                       // preview the weather: cold | mild                 // hold one promo (preview / freeze)
  const weekday = () => Number(params.get("day")) || RS.weekday();   // &day= is for previews only
  const STILL = params.get("motion") === "0" ||
    (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  /*
   * RULE (Brian, Nov 23): each TV needs at least 5 pictures and 5 videos, and no
   * picture or video may appear on both TVs. Give every new scene a tv: 1 or 2.
   * Quality bar: 8 out of 10. Anything Brian rates under that is switched off.
   *
   * PROMOS: what the window (left panel) can show. One entry per scene.
   *   id        unique name
   *   tv        1, 2, or leave out for both
   *   type      signature (evergreen) | daily (today's special) | brand
   *   eyebrow, title, desc   the words (desc is optional)
   *   photo     full-bleed photo in boards/img, 980x1531 portrait JPG
   *   focus     which part of the photo to keep, "across down" ("50% 40%")
   *   photos    ["a.jpg", "b.jpg"] = next photo each time round
   *   brandImg  a centered card in boards/img (logo, QR code)
   *   video, poster, footage, approved, brandTitle   see the Rocco's notes:
   *             a stock clip is ALWAYS an unpriced brand spot.
   *   priceId   Sheet ID. The price always comes from the feed.
   *   size      for multi-size prices: which size to show ("Large")
   *   label     small word after the price ("Large 16″")
   *   days, hours, from, until, seconds, priority, slot, enabled
   *   season    ["MM-DD", "MM-DD"] = only between these dates, every year
   *             (may wrap past New Year's)
   *   offSeason ["MM-DD", "MM-DD"] = never between these dates
   *   feature   "bh" = animated Proudly Featuring Boar's Head tile (needs photo)
   * A scene is skipped (never shown broken) when it is out of schedule,
   * its photo did not load, or its item has no price or was removed.
   *
   * Phase 1 (Nov 23): words and logos only, no food photos yet. Every line
   * below is Ludwig's own copy (their board, their site).
   */
  const PROMOS = [
    // =====================================================================
    // LIVE (set on the tablet, Today tab). Not counted in the 5 + 5.
    // Each one only shows while it is set: soups the day they were saved,
    // specials until they end, catering until it is turned off, the cookie
    // for its month. live: names which setting fills the scene (see
    // liveSoups / liveSpecials / liveCatering / liveCookie). No tv = both
    // TVs; specials pick their own TV on the tablet, nth = which one.
    // =====================================================================
    { id: "t-cookie", tv: 1, type: "daily", live: "cookie", priority: 1, seconds: 10, eyebrow: "Cookie of the Month",
      brandImg: "ludwigs-logo.png", art: { w: 330 } },
    // Cookie of the Month with its photo (COOKIE_PHOTOS). The logo card above
    // only shows for a cookie that has no photo yet. photo = any cookie file,
    // just so the frame is built; dressLive swaps in the right one.
    { id: "t-cookie-spot", tv: 1, type: "daily", live: "cookiespot", priority: 1, seconds: 10, eyebrow: "Cookie of the Month",
      photo: "cookie-smores.jpg", focus: "50% 50%" },
    { id: "t-soups", boost: ["morning"], tv: 2, type: "daily", live: "soups", priority: 2, seconds: 14, eyebrow: "Homemade Soups Today",
      desc: "Made in house, preservative free" },   // Ludwig's own words on their soup posts
    // One of today's soups, big photo, a different one each time round
    // (only soups that have a photo in SOUP_PHOTOS). photo = any soup file,
    // just so the frame is built; dressLive swaps in the right one.
    { id: "t-soup-spot", boost: ["morning"], tv: 2, type: "daily", live: "soupspot", priority: 2, seconds: 10, eyebrow: "Homemade Soup of the Day",
      photo: "soup-chicken-noodle.jpg", focus: "50% 55%" },
    { id: "t-special-1", boost: ["lunch"], type: "daily", live: "special", nth: 0, priority: 1, seconds: 12 },
    { id: "t-special-2", boost: ["lunch"], type: "daily", live: "special", nth: 1, priority: 1, seconds: 12 },
    { id: "t-special-3", boost: ["lunch"], type: "daily", live: "special", nth: 2, priority: 1, seconds: 12 },
    { id: "t-special-4", boost: ["lunch"], type: "daily", live: "special", nth: 3, priority: 1, seconds: 12 },
    // Catering spotlight over Ludwig's own catering photos (one per TV, from that TV's own set).
    { id: "t-catering-1", tv: 1, type: "daily", live: "catering", priority: 1, seconds: 12, eyebrow: "Ludwig's Catering",
      photo: "fruit-platter.jpg", focus: "50% 40%" },
    { id: "t-catering-2", tv: 2, type: "daily", live: "catering", priority: 1, seconds: 12, eyebrow: "Ludwig's Catering",
      photo: "event-grazing.jpg", focus: "50% 45%" },
    // =====================================================================
    // TV 1 (pizza): 5 pictures + 5 videos, none shared with TV 2.
    // =====================================================================
    // Words + logo (Ludwig's own copy). Not counted as a picture.
    { id: "bake-at-home", boost: ["dinner"], tv: 1, type: "signature", eyebrow: "Bake-at-Home", title: "Fresh & Local",
      desc: "All natural. No additives, no preservatives, nothing artificial.", brandImg: "ludwigs-logo.png", art: { w: 330 } },
    // Pictures: Ludwig's own (Facebook / Instagram). Brian's ratings in brackets.
    { id: "since-1998", tv: 1, type: "signature", eyebrow: "Since 1998", title: "Fine Foods & Catering",
      desc: "Serving upper Chester County", photo: "storefront-flags.jpg", focus: "50% 35%" },            // FB 1743838367741816 [8]
    { id: "p-cookies", tv: 1, type: "signature", eyebrow: "Something Sweet", title: "Sprinkle Sugar Cookies",
      photo: "sprinkle-cookies.jpg", focus: "50% 40%" },                                                // FB 1704332841692369 [8]
    { id: "p-grazing-board", tv: 1, type: "signature", eyebrow: "Catering", title: "Charcuterie Boards",
      desc: "Order one for your next event", photo: "grazing-board.jpg", focus: "45% 40%" },            // FB 1713566350769018 [7+]
    { id: "p-fruit-platter", tv: 1, type: "signature", eyebrow: "Catering", title: "Fruit & Cheese Platters",

  Object.keys(BOARDS).forEach(k => BOARDS[k].columns.forEach(col => col.forEach(sec => {
    if (sec.groups) sec.items = [].concat(...sec.groups.map(g => g[1]));
  })));

  // on the tablet.
  const LAST_BUILT_ID = 99;
  const isTabletItem = id => { const m = /^L(\d+)$/.exec(String(id)); return !!m && Number(m[1]) > LAST_BUILT_ID; };
  // Every ID on both boards, so an item on the other TV is never "new" here.
  const KNOWN = new Set([SPEC, "L004", "L060", "L061"]);
  Object.keys(BOARDS).forEach(k => BOARDS[k].columns.forEach(col => col.forEach(sec => {
    if (sec.sizes) KNOWN.add(sec.sizes);
    (sec.items || []).forEach(it => it.ids.forEach(id => KNOWN.add(id)));
    (sec.items || []).forEach(it => { if (it.add) KNOWN.add(it.add[0]); });
  })));

  /** This board's columns with removed rows dropped and new items added. */
  function liveColumns() {
    const cat = {};
    RS.items.forEach(it => { cat[it.id] = String(it.category || ""); });

    const tally = {};
    const cols = B.columns.map(col => col.map(sec => Object.assign({}, sec, { items: sec.items ? sec.items.slice() : sec.items })));
    cols.forEach(col => col.forEach(sec => (sec.items || []).forEach(it => it.ids.forEach(id => {
      const c = cat[id];
      if (!c) return;
      tally[c] = tally[c] || new Map();
      tally[c].set(sec, (tally[c].get(sec) || 0) + 1);
    }))));
    const homeFor = c => {
      const m = tally[c];
      if (!m) return null;
      return [...m.entries()].sort((a, b) => b[1] - a[1])[0][0];
    };

    RS.items.forEach(it => {
      if (!isTabletItem(it.id) || KNOWN.has(it.id) || RS.isRemoved(it.id) || !it.item) return;
      const sec = homeFor(String(it.category || ""));
      if (!sec) return;
      const row = { n: String(it.item).trim(), ids: [it.id] };
      sec.items.push(row);
      if (sec.groups) sec.groups = sec.groups.map((g, i) => i === sec.groups.length - 1 ? [g[0], g[1].concat(row)] : g);
    });

    const keep = it => !it.ids.length || !it.ids.every(RS.isRemoved);
    return cols.map(col => col
      .map(sec => {
        if (!sec.items) return sec;
        const out = Object.assign(sec, { items: sec.items.filter(keep) });
        if (sec.groups) out.groups = sec.groups.map(g => [g[0], g[1].filter(keep)]).filter(g => g[1].length);
        return out;
      })
      .filter(sec => !sec.items || sec.items.length));
  }

  // Size words on the TV: "Small $13.00 / Large $21.95" -> SMALL 10" 13.00 ...
  const SIZE_LABEL = { Small: "Small 10″", Large: "Large 16″", S: "Small", L: "Large" };
  function sizesHtml(str) {
    return String(str).split("/").map(part => {
      const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
      return m ? '<span class="lbl">' + esc(SIZE_LABEL[m[1]] || m[1]) + '</span>' + RS.money(m[2]) : RS.money(part.trim());
    }).join("");
  }
  /** Section price strip: one price for every row below it. */
  function stripHtml(id, label) {
    const str = RS.price(id);
    if (!str) return "";
    return '<div class="sizes">' + str.split("/").map(part => {
      const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
      return '<span class="price">' + (m ? '<em>' + esc(SIZE_LABEL[m[1]] || m[1]) + '</em>' + RS.money(m[2])
        : (label ? '<em>' + esc(label) + '</em>' : '') + RS.money(part)) + '</span>';
    }).join("") + '</div>';
  }
  function priceHtml(it) {
    if (it.np || !it.ids.length) return "";
    const list = it.ids.map(id => RS.price(id)).filter(Boolean);
    if (!list.length) return "";

  /*
   * FIT. Order matters:
   *   1. Tighten row spacing (text stays full size).
   *   2. Shrink all text together, one small step at a time.
   *   3. Below FS_FLOOR keep going so nothing is ever cut off, but flag
   *      the board "small" so it shows up in &debug=1. That is the cue
   *      to move a category to the other TV, not to live with tiny text.
   * Then every column gets its own row spacing so all columns end on
   * the same line.
   */
  let fitState = { fs: 1, pad: PAD_BASE, small: false };
  function fit() {
    const cols = [...document.querySelectorAll(".menu .col")];
    // offsetHeight / clientHeight are layout pixels on the 1920x1080 stage.
    // (getBoundingClientRect is NOT: it shrinks or grows with the stage
    // when the TV scales it, which made rows run off the bottom at 720p.)
    const natural = c => [...c.children].reduce((h, s) => h + s.offsetHeight, 0) +
      (c.children.length - 1) * parseFloat(getComputedStyle(c).rowGap || 0);
    // A long category name tightens its own letter spacing before it is
    // allowed to shrink the whole board.
    const heads = [...document.querySelectorAll(".menu .sec-h")];
    const fitHeads = () => heads.forEach(h => {
      let ls = 0.13; h.style.letterSpacing = "";
      while (h.scrollWidth > h.clientWidth + 1 && ls > 0.02) { ls = Math.round((ls - 0.01) * 100) / 100; h.style.letterSpacing = ls + "em"; }
    });
    const over = () => { fitHeads(); return cols.some(c => natural(c) > c.clientHeight - 2) ||
      [...document.querySelectorAll(".menu .row, .menu .sec-h")].some(r => r.scrollWidth > r.clientWidth + 1); };
    const set = (fs, pad) => { stage.style.setProperty("--fs", fs); stage.style.setProperty("--pad", pad); };
    cols.forEach(c => c.style.removeProperty("--pad"));

    let fs = 1, pad = PAD_BASE;
    set(fs, pad);
    while (over() && pad > PAD_MIN) { pad -= 1; set(fs, pad); }
    while (over() && fs > 0.6) { fs = Math.round((fs - 0.01) * 100) / 100; set(fs, pad); }

    // Share out the leftover space so the columns bottom-align.
    cols.forEach(c => {
      const rows = c.querySelectorAll(".row").length;
      if (!rows) return;
      const free = c.clientHeight - 2 - natural(c);
      const extra = Math.floor((free / (rows * 2 * fs)) * 10) / 10;
      if (extra > 0) c.style.setProperty("--pad", Math.min(PAD_MAX, pad + extra));
      // Belt and braces: sharing out space must never push a row off the end.
      if (natural(c) > c.clientHeight) c.style.removeProperty("--pad");
    });

    fitState = { fs: fs, pad: pad, small: fs < FS_FLOOR };
    stage.dataset.fs = fs;
    stage.dataset.fit = fitState.small ? "small" : "ok";
    diag();
  }

  // thrown away (the last good one stays), so weather can never break the board.
  const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=40.10&longitude=-75.77" +

  function eligible() {
    let list;
    const day = weekday(), hour = shopHour(), today = RS.today();
    list = PROMOS.filter(p => {
      if (p.enabled === false) return false;
      if (p.live && !liveOn(p)) return false;                  // nothing set on the tablet
      if (p.tv && p.tv !== tv) return false;
      if (p.days && p.days.indexOf(day) < 0) return false;
      if (p.hours && (hour < p.hours[0] || hour >= p.hours[1])) return false;
      if (p.from && today < p.from) return false;
      if (p.until && today > p.until) return false;
      if (p.season && !inSeason(p.season, today)) return false;
      if (p.offSeason && inSeason(p.offSeason, today)) return false;
      if (p.img && photoOk[p.img] !== true) return false;
      if (p.photo && photoOk[p.photo] !== true) return false;
      if (p.brandImg && photoOk[p.brandImg] !== true) return false;
      if (p.video && !stillSrc(p)) return false;                // a clip must have a still
      if (p.poster && photoOk[p.poster] !== true) return false;
      if (p.priceId && !isBrandSpot(p) && (RS.isRemoved(p.priceId) || !promoPrice(p))) return false;
      if (p.priceId && RS.isSoldOut(p.priceId)) return false;          // 86'd today: skip its scene
      return true;
    });
    // Until the photos have settled (a moment after power-on) only the
    // wordmark card shows, so the hero never flips through half a list.
    if (!photosSettled) return [BRAND_CARD];
    list.sort((a, b) => (b.priority || 0) - (a.priority || 0));
    const pinned = PIN && list.filter(p => p.id === PIN);
    if (pinned && pinned.length) return pinned;
    // Shared spots: promos with the same slot (e.g. "salads") take turns in
    // ONE place in the rotation, swapping every SLOT_MINUTES, so adding an
    // item never pushes another one out. Clock-based, so both reloads and
    // restarts agree on whose turn it is.
    const slotTurn = Math.floor(Date.now() / (SLOT_MINUTES * 60000));
    const groups = {};
    list.forEach(p => { if (p.slot) (groups[p.slot] = groups[p.slot] || []).push(p); });
    list = list.filter(p => !p.slot || p === groups[p.slot][slotTurn % groups[p.slot].length]);
    // Specials (priority) go first; after that, photo promos and video
    // spots take turns so the videos are spread through the rotation.
    const top = list.filter(p => (p.priority || 0) > 0);
    const photos = list.filter(p => !(p.priority > 0) && !p.video);
    const clips = list.filter(p => !(p.priority > 0) && p.video);
    const mixed = [];
    while (photos.length || clips.length) {
      if (photos.length) mixed.push(photos.shift());
      if (clips.length) mixed.push(clips.shift());
    }
    // Time of day / weather: boosted scenes move to the front of the loop
    // (photos and clips still alternate), then up to BOOST_REPEAT of them
    // come round a second time, spread evenly through the rest of the loop,
    // never next to themselves.
    const pushedTop = top.filter(boosted);
    const pushedMixed = mixed.filter(boosted);
    if (pushedTop.length || pushedMixed.length) {
      const front = [], pPh = pushedMixed.filter(p => !p.video), pCl = pushedMixed.filter(p => p.video);
      const rest = mixed.filter(p => pushedMixed.indexOf(p) < 0);
      while (pPh.length || pCl.length) {
        // Out of boosted photos? Borrow a regular photo so clips never run back to back.
        const borrow = rest.findIndex(p => !p.video);
        const ph = pPh.length ? pPh.shift() : (pCl.length && front.length && borrow >= 0 ? rest.splice(borrow, 1)[0] : null);
        if (ph) front.push(ph);
        if (pCl.length) front.push(pCl.shift());
      }
      const again = pushedTop.concat(front.filter(boosted)).slice(0, BOOST_REPEAT);
      const step = Math.max(1, Math.floor(rest.length / (again.length + 1)));
      again.forEach((p, i) => rest.splice(Math.min(rest.length, step * (i + 1) + i), 0, p));
      mixed.length = 0;
      front.concat(rest).forEach(p => mixed.push(p));
      for (let i = 1; i < mixed.length; i++) {              // no scene twice in a row
        if (mixed[i] === mixed[i - 1] && i + 1 < mixed.length) { const t = mixed[i]; mixed[i] = mixed[i + 1]; mixed[i + 1] = t; }
      }
    }
    // Catering comes round more often than the rest: after the specials,
    // it shows again every CATERING_EVERY scenes, so a customer waiting at
    // the counter sees it at least once (Brian, Nov 24).
    const cater = top.filter(p => p.live === "catering");
    if (cater.length && mixed.length > CATERING_EVERY) {
      for (let i = CATERING_EVERY; i < mixed.length; i += CATERING_EVERY + 1) mixed.splice(i, 0, cater[0]);
    }
    list = top.concat(mixed);
    return list.length ? list : [BRAND_CARD];
  }
  const CATERING_EVERY = 3;   // catering scene repeats after every 3 other scenes
  const BOOST_REPEAT = 3;     // at most 3 time-of-day/weather scenes show twice per loop
  const secondsOf = p => Math.max(4, Number(p.seconds) || PROMO_SECONDS);

  /** Which promo the clock says is on right now, and how long until the next. */
  function clockPick(list) {
    const total = list.reduce((s, p) => s + secondsOf(p), 0);
    let pos = (Date.now() / 1000) % total;
    for (let i = 0; i < list.length; i++) {
      const s = secondsOf(list[i]);
      if (pos < s) return { index: i, left: s - pos };
      pos -= s;
    }
    return { index: 0, left: secondsOf(list[0]) };
  }

  const slides = {};    // promo id -> element
  function slideFor(p) {
    if (slides[p.id]) return slides[p.id];
    const el = document.createElement("div");
    el.className = "slide" + ((p.wordmark || p.brandImg === "ludwigs-logo.png") ? " logo-card" : "");
    const a = p.art || {};
    const spot = isBrandSpot(p);
    let art;
    if (p.video) {
      // Still first; the <video> is added only while this promo is on screen.
      el.classList.add("has-clip");
      art = '<div class="clip" style="--focus:' + esc(p.focus || "50% 50%") + '"><img src="' + stillSrc(p) + '" alt=""></div>';
    } else if (p.feature === "bh" && p.photo) {
      // Ludwig's x Proudly Featuring Boar's Head brand tile (see .feat CSS).
      el.classList.add("feature");
      let embers = "";
      for (let i = 0; i < 26; i++) {
        const r = (n => ((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1);   // fixed pseudo-random
        embers += '<span style="left:' + (4 + r(1) * 92).toFixed(1) + '%;--s:' + (3 + r(2) * 6).toFixed(1) + 'px;--t:' +
          (5 + r(3) * 5).toFixed(2) + 's;--d:' + (-r(4) * 9).toFixed(2) + 's;--x:' + (-40 + r(5) * 80).toFixed(0) + 'px"></span>';
      }
      const bh = IMG + (p.logo || "boars-head-pf-white.png");
      art = '<div class="clip photo" style="--focus:' + esc(p.focus || "50% 50%") + '"><img src="' + IMG + p.photo + '" alt=""></div>' +
        '<div class="embers">' + embers + '</div>' +
        '<div class="feat"><div class="feat-glow"></div>' +
        '<img class="feat-rocco" src="' + LOGO + '" alt="" onerror="this.remove()">' +
        '<div class="feat-rule"><i></i><b></b><i></i></div>' +
        '<div class="feat-bh"><img src="' + bh + '" alt=""><div class="shine" style="-webkit-mask-image:url(' + bh + ');mask-image:url(' + bh + ')"></div></div>' +
        '</div>';
    } else if (p.photo) {
      // A full-bleed photo (not a cutout), framed like the video spots, with a
      // slow push-in. For dishes whose cutout sells them short.
      art = '<div class="clip photo" style="--focus:' + esc(p.focus || "50% 50%") + '"><img src="' + IMG + p.photo + '" alt="">' +
        (p.logo ? '<img class="clip-logo" src="' + IMG + p.logo + '" alt="" onerror="this.remove()">' : '') +
        (p.credit ? '<span class="clip-credit">' + esc(p.credit) + '</span>' : '') + '</div>';
    } else if (p.img) {
      const src = IMG + p.img;
      art = '<div class="plate" style="width:' + (a.w || 460) + 'px;margin-left:' + (a.x || 0) + 'px;margin-top:' + (a.y || 0) + 'px;transform-origin:center">' +
        '<div class="zoom"><div style="position:relative;transform:rotate(' + (a.rot || 0) + 'deg)"><img src="' + src + '" alt="">' +
        '<div class="sweep" style="-webkit-mask-image:url(' + src + ');mask-image:url(' + src + ')"></div></div></div></div>';
    } else if (p.live === "soups") {
      art = '<img class="soupbg" alt="" style="display:none"><div class="soupcard"><ul></ul></div>';
    } else if (p.live === "special") {
      // Photo (from the tablet) when the special has one, else the gold price circle.
      art = '<div class="clip photo spphoto" style="--focus:50% 55%;display:none"><img alt=""></div>' +
        '<div class="medal gold"><span class="price"></span><small>Special</small></div>';
    } else if (p.brandImg) {
      art = '<div class="brandart"' + (a.w ? ' style="width:' + a.w + 'px"' : '') + '><img src="' + IMG + p.brandImg + '" alt=""></div>';
    } else if (p.wordmark) {
      art = '<div class="wordmark"><img src="' + LOGO + '" alt="Ludwig’s Village Market & Catering"></div>';
    } else {
      art = '<div class="medal"><span class="price"></span>' + (p.badge ? '<small>' + esc(p.badge) + '</small>' : '') + '</div>';
    }
    const medalOnly = !p.video && !p.photo && !p.img && !p.brandImg && !p.wordmark;
    // Live scenes get their words in dressLive (they change from the tablet).
    const title = p.live ? (p.live === "soups" ? "" : " ") : spot ? (p.brandTitle || "") : (p.title || "");
    const desc = p.live === "special" || p.live === "catering" || p.live === "soupspot" ? " " : spot ? "" : (p.desc || "");
    const priced = (!!p.priceId && !spot && !medalOnly) || p.live === "special";
    el.innerHTML = '<div class="art">' + art + '</div><div class="copy">' +
      '<div class="eyebrow">' + (p.badge && !medalOnly && !spot ? '<span class="badge">' + esc(p.badge) + '</span>' : '') +
        (p.fav && !spot ? '<span><b class="favstar">&#9733;</b> Ludwig’s Favorite</span>' : '<span>' + esc(p.eyebrow || "") + '</span>') + '</div>' +
      (title ? '<div class="title">' + esc(title) + '</div>' : '') +
      (desc ? '<div class="desc">' + esc(desc) + '</div>' : '') +
      (priced ? '<div class="pricebar"><i></i><span class="price"></span>' + (p.label ? '<small>' + esc(p.label) + '</small>' : '') + '</div>' : '') +
      '</div>';
    document.getElementById("slides").appendChild(el);
    slides[p.id] = el;
